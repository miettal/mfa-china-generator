<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>引用画像ジェネレーター</title>
  <!-- 日本語用フォント -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #0b0b0b;
      color: #eee;
      font-family: "Noto Serif JP", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      padding: 32px 16px;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 32px;
    }

    @media (max-width: 960px) {
      .app {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      letter-spacing: 0.08em;
    }

    .description {
      margin-bottom: 20px;
      font-size: 13px;
      color: #b0b0b0;
      line-height: 1.6;
    }

    .card {
      background: #111111;
      border-radius: 18px;
      padding: 18px 20px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid #2b2b2b;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      letter-spacing: 0.08em;
    }

    .field small {
      display: block;
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }

    textarea,
    input[type="text"] {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #444;
      background: #181818;
      color: #f5f5f5;
      padding: 10px 12px;
      font-family: "Noto Serif JP", system-ui, sans-serif;
      font-size: 13px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    textarea:focus,
    input[type="text"]:focus {
      border-color: #f6d27d;
      box-shadow: 0 0 0 1px rgba(246, 210, 125, 0.3);
    }

    textarea {
      min-height: 140px;
      white-space: pre-wrap;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    button {
      border-radius: 999px;
      border: none;
      padding: 9px 18px;
      font-size: 13px;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #f7d48b, #d9a44c);
      color: #3b2409;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.45);
    }

    button.secondary {
      background: #232323;
      color: #e5e5e5;
      border: 1px solid #3b3b3b;
      box-shadow: none;
    }

    button:active {
      transform: translateY(1px);
    }

    /* プレビュー部分 */

    .preview-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #preview {
      position: relative;
      width: 768px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      overflow: hidden;
      color: #ffffff;
      /* 背景（赤グラデーション） */
      background:
        radial-gradient(circle at 15% 0%, #8b1114 0, rgba(0, 0, 0, 0) 60%),
        radial-gradient(circle at 85% 0%, #b82023 0, rgba(0, 0, 0, 0) 60%),
        radial-gradient(circle at 50% 80%, #380303 0, #120000 55%),
        linear-gradient(180deg, #5b0507, #1c0000 70%, #000000 100%);
      padding: 80px 80px 70px;
      box-sizing: border-box;
      box-shadow: 0 32px 60px rgba(0, 0, 0, 0.7);
    }

    @media (max-width: 600px) {
      #preview {
        padding: 56px 32px 50px;
        border-radius: 20px;
      }
    }

    .preview-inner {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 上部の建物アイコン */
    .emblem {
      display: flex;
      justify-content: center;
      margin-bottom: 36px;
    }

    .emblem svg {
      width: 120px;
      height: auto;
    }

    .emblem path {
      stroke: #f2cf86;
      fill: none;
      stroke-width: 1.7;
    }

    .quote {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-size: clamp(18px, 2.4vw, 26px);
      line-height: 2.1;
      letter-spacing: 0.16em;
      white-space: pre-line;
    }

    .quote::before,
    .quote::after {
      content: "“";
      font-size: 1.2em;
      transform: translateY(-0.1em);
      margin: 0 0.05em;
    }

    .quote::after {
      content: "”";
    }

    .footer {
      width: 100%;
      border-top: 1px solid rgba(230, 210, 180, 0.6);
      margin-top: 32px;
      padding-top: 18px;
      display: flex;
      justify-content: center;
      font-size: clamp(11px, 1.4vw, 13px);
      letter-spacing: 0.2em;
    }

    .footer span + span::before {
      content: "　";
    }

    .footer span {
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 左側: コントロール -->
    <div class="card">
      <h1>引用画像ジェネレーター</h1>
      <p class="description">
        任意のテキストを入力すると、右側に赤い背景の引用画像としてプレビューされます。<br>
        そのまま SNS などで使える正方形画像を簡単に作成できます。
      </p>

      <div class="field">
        <label for="quoteInput">本文</label>
        <textarea id="quoteInput">日本は再び軍国主義の過ちを
繰り返すつもりなのか
再び中国人民とアジア人民を
敵に回すつもりなのか
戦後の国際秩序を
覆そうとしているのか</textarea>
        <small>改行位置は自由に調整してください（そのまま行区切りとして反映されます）。</small>
      </div>

      <div class="field">
        <label for="sourceInput">出典（下部左）</label>
        <input id="sourceInput" type="text" value="中国外交部報道官">
      </div>

      <div class="field">
        <label for="dateInput">日付（下部右）</label>
        <input id="dateInput" type="text" value="2025年11月13日">
      </div>

      <div class="buttons">
        <button id="downloadBtn">画像として保存（PNG）</button>
        <button id="resetBtn" class="secondary">初期テキストに戻す</button>
      </div>
    </div>

    <!-- 右側: プレビュー -->
    <div class="preview-wrapper">
      <div id="preview">
        <div class="preview-inner">
          <div class="emblem">
            <!-- シンプルな建物アイコン（線画） -->
            <svg viewBox="0 0 200 80" aria-hidden="true">
              <path d="M40 70 V30
                       C40 20 55 10 100 10
                       C145 10 160 20 160 30
                       V70
                       M40 40 H20 V70
                       M160 40 H180 V70
                       M70 25 V70
                       M100 20 V70
                       M130 25 V70" />
            </svg>
          </div>

          <div class="quote" id="quotePreview"></div>

          <div class="footer">
            <span id="sourcePreview">中国外交部報道官</span>
            <span id="datePreview">2025年11月13日</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- html2canvas: 要ネット接続 -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const quoteInput = document.getElementById("quoteInput");
    const sourceInput = document.getElementById("sourceInput");
    const dateInput = document.getElementById("dateInput");

    const quotePreview = document.getElementById("quotePreview");
    const sourcePreview = document.getElementById("sourcePreview");
    const datePreview = document.getElementById("datePreview");

    const downloadBtn = document.getElementById("downloadBtn");
    const resetBtn = document.getElementById("resetBtn");
    const preview = document.getElementById("preview");

    const initialState = {
      quote: quoteInput.value,
      source: sourceInput.value,
      date: dateInput.value,
    };

    function syncPreview() {
      quotePreview.textContent = quoteInput.value || "テキストを入力してください";
      sourcePreview.textContent = sourceInput.value || "";
      datePreview.textContent = dateInput.value || "";
    }

    quoteInput.addEventListener("input", syncPreview);
    sourceInput.addEventListener("input", syncPreview);
    dateInput.addEventListener("input", syncPreview);

    resetBtn.addEventListener("click", () => {
      quoteInput.value = initialState.quote;
      sourceInput.value = initialState.source;
      dateInput.value = initialState.date;
      syncPreview();
    });

    downloadBtn.addEventListener("click", async () => {
      // 高解像度で出力したいので scale を上げる
      const scale = 2;
      const rect = preview.getBoundingClientRect();

      const canvas = await html2canvas(preview, {
        backgroundColor: null,
        scale,
        width: rect.width,
        height: rect.height,
      });

      const link = document.createElement("a");
      link.download = "quote-image.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    // 初期同期
    syncPreview();
  </script>
</body>
</html>
